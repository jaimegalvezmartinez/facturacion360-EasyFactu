spring.application.name=facturacion360
spring.datasource.url=jdbc:mysql://localhost:3306/bd_facturacion
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
logging.level.org.springframework.jdbc.core=DEBUG
# Sin esta linea, el paquete de la aplicacion se queda en INFO y los log.debug del
# repositorio (la consulta que se monta y lo que devuelve) no se imprimen nunca.
logging.level.edu.xtd.facturacion360=DEBUG

server.port=81

# ─────────────────────────────────────────────────────────────────────────────
# SEGURIDAD DEL PORTAL
#
# El resto de las reglas (qué se puede ver sin entrar, qué necesita ser
# administrador) NO están aquí: están en ConfiguracionSeguridad, porque son
# código y no configuración, y para que se puedan ver todas de un vistazo.
# ─────────────────────────────────────────────────────────────────────────────

# Interruptor del registro público (POST /auth/registro y el botón "Crear cuenta"
# de la pantalla de acceso).
#
# Con true, cualquiera que llegue a la pantalla de acceso puede crearse una cuenta,
# pero esa cuenta nace DESACTIVADA (UsuarioServiceImpl.registrar la guarda con
# activo = false): puede esperar a que un administrador la active desde el panel, y
# hasta entonces no sirve para entrar en nada. Quien se registra ocupa un nombre de
# usuario y una fila en la tabla, y nada más.
#
# Con false, la aplicación se queda con las cuentas que ya haya en la tabla usuarios y
# las nuevas las da de alta un administrador desde el panel, que es lo mismo pero
# sin que nadie pueda crear filas por su cuenta.
app.seguridad.registro-abierto=true

# Minutos que dura la sesión sin actividad. Al caducar, la siguiente petición
# responde 401 y el JavaScript lleva al login.
server.servlet.session.timeout=10m

# La cookie de sesión va solo por HTTPS. En local, que es http, mandarla solo
# por HTTPS haría que no se guardara nunca y que nadie pudiera entrar; por eso
# está en false y hay que subirlo a true en cuanto haya un servidor con TLS.
server.servlet.session.cookie.secure=false

# Cookie de sesión accesible solo por el servidor: el JavaScript de la aplicación
# no necesita leerla y así no puede leerla.
server.servlet.session.cookie.http-only=true