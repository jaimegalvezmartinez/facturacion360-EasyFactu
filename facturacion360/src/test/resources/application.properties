spring.datasource.url=jdbc:h2:mem:bd_facturacion_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:esquema-test.sql
spring.sql.init.data-locations=classpath:datos-test.sql

# Sin esto, la aplicación falla al arrancar si no puede conectar con el MySQL de
# application.properties, y los tests correrían contra una base de datos ajena.
spring.datasource.hikari.maximum-pool-size=4

# No hace falta MySQL para nada de aquí.
logging.level.edu.xtd.facturacion360=INFO
logging.level.org.springframework.jdbc.core=OFF
